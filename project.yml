name: DropPointNative
options:
  bundleIdPrefix: io.github.sanbu3
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  DropPointNative:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/CatInBox.png
        buildPhase: resources
      - path: Resources/Cat_in_Box.svg
        buildPhase: resources
      - path: Resources/Empty Box.svg
        buildPhase: resources
      - path: Resources/DropPointLogo.svg
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sanbu3.droppoint.macos
        PRODUCT_NAME: DropPoint
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 1.5.0
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  DropPointNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DropPointNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sanbu3.droppoint.macos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DropPoint.app/Contents/MacOS/DropPoint"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DropPointNative:
    build:
      targets:
        DropPointNative: all
        DropPointNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DropPointNativeTests
